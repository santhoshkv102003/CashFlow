<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PayBuddy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

<div id="app">

  <!-- ══════════════════════════════
       HEADER
  ══════════════════════════════ -->
  <header class="header" id="mainHeader">
    <button class="btn-back" id="btnBack" onclick="goBack()" style="display:none">&#8592;</button>
    <span class="logo-icon">₹</span>
    <span class="logo-text" id="headerTitle">PayBuddy</span>
  </header>

  <!-- ══════════════════════════════
       MAIN TABS  (Friends / My expenses)
  ══════════════════════════════ -->
  <div class="tab-strip" id="mainTabStrip">
    <button class="tab-btn active" id="tabFriends"  onclick="switchTab('friends')">Friends</button>
    <button class="tab-btn"        id="tabExpenses" onclick="switchTab('expenses')">My expenses</button>
  </div>

  <!-- ══════════════════════════════
       SCREEN: FRIENDS LIST
  ══════════════════════════════ -->
  <section class="screen active" id="screenFriends">
    <button class="btn-grad" onclick="openAddFriend()">+ Add Friend</button>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="friendSearch" type="text"
             placeholder="Search friends..." oninput="renderFriends()" />
    </div>
    <div class="friends-list" id="friendsList"></div>
  </section>

  <!-- ══════════════════════════════
       SCREEN: FRIEND DETAIL
  ══════════════════════════════ -->
  <section class="screen" id="screenFriendDetail">

    <!-- Avatar + name -->
    <div class="detail-hero">
      <div class="avatar-wrap" id="detailAvatarWrap">
        <div class="avatar avatar-lg" id="detailAvatar"></div>
        <label class="camera-badge" title="Change photo">
          📷<input type="file" accept="image/*" id="avatarFileInput" style="display:none" onchange="handleAvatarUpload(event)" />
        </label>
      </div>
      <div class="detail-name" id="detailName"></div>
    </div>

    <!-- Summary boxes -->
    <div class="detail-boxes">
      <div class="detail-box">
        <div class="db-label">I give</div>
        <div class="db-amount red" id="detailIGive">₹0</div>
      </div>
      <div class="detail-box">
        <div class="db-label" id="detailTheyLabel">They give me</div>
        <div class="db-amount green" id="detailTheyGive">₹0</div>
      </div>
    </div>

    <!-- Net balance -->
    <div class="net-balance" id="netBalance">All settled 🎉</div>

    <!-- Action buttons -->
    <div class="action-row">
      <button class="action-btn red-btn"   onclick="openEntryForm('igive')">I Give</button>
      <button class="action-btn green-btn" id="theyGiveBtn" onclick="openEntryForm('theygive')">They Give Me</button>
      <button class="action-btn outline-btn" onclick="showFriendHistory()">History</button>
    </div>

  </section>

  <!-- ══════════════════════════════
       SCREEN: ENTRY FORM  (add / edit)
  ══════════════════════════════ -->
  <section class="screen" id="screenEntryForm">

    <div class="exp-form-card">
      <div class="form-title" id="entryFormTitle">Add entry</div>
      <div class="exp-inputs">
        <div class="amount-wrap">
          <span class="rupee">₹</span>
          <input class="amount-input" id="entryAmt" type="number" min="0" placeholder="0" />
        </div>
        <input class="desc-input" id="entryDesc" type="text" placeholder="Purpose (e.g. Lunch)" />
      </div>
      <button class="btn-grad" onclick="saveEntry()">Save</button>
    </div>

    <!-- Recent entries for this category -->
    <div class="section-label" id="recentLabel"></div>
    <div class="history-list" id="entryRecentList"></div>

  </section>

  <!-- ══════════════════════════════
       SCREEN: FRIEND HISTORY
  ══════════════════════════════ -->
  <section class="screen" id="screenFriendHistory">
    <div class="history-sections" id="friendHistorySections"></div>
  </section>

  <!-- ══════════════════════════════
       SCREEN: MY EXPENSES
  ══════════════════════════════ -->
  <section class="screen" id="screenExpenses">

    <div class="summary-row">
      <div class="summary-card">
        <div class="sc-label">Spent today</div>
        <div class="sc-amount" id="spentToday">₹0</div>
      </div>
      <div class="summary-card">
        <div class="sc-top">
          <div class="sc-label">Spent this</div>
          <div class="period-toggle">
            <button class="period-btn active" id="pW" onclick="setPeriod('W',this)">W</button>
            <button class="period-btn"        id="pM" onclick="setPeriod('M',this)">M</button>
            <button class="period-btn"        id="pY" onclick="setPeriod('Y',this)">Y</button>
          </div>
        </div>
        <div class="sc-amount" id="spentPeriod">₹0</div>
        <div class="sc-sub"    id="periodLabel">last 7 days</div>
      </div>
    </div>

    <div class="exp-tab-row">
      <button class="exp-tab-btn active" id="etAdd"     onclick="switchExpTab('add')">Add</button>
      <button class="exp-tab-btn"        id="etHistory" onclick="switchExpTab('history')">History</button>
    </div>

    <div id="sectionAdd">
      <div class="exp-form-card">
        <div class="form-title">Add an expense</div>
        <div class="exp-inputs">
          <div class="amount-wrap">
            <span class="rupee">₹</span>
            <input class="amount-input" id="expAmt" type="number" min="0" placeholder="0" />
          </div>
          <input class="desc-input" id="expDesc" type="text" placeholder="What was it for? e.g. Tea" />
        </div>
        <button class="btn-grad" onclick="saveExpense()">Save expense</button>
      </div>
    </div>

    <div id="sectionHistory" style="display:none">
      <div class="history-list" id="historyList"></div>
      <button class="reset-btn" id="resetBtn" onclick="resetExpenses()">Reset all expenses</button>
    </div>

  </section>

</div><!-- /#app -->


<!-- ══════════════════════════════
     MODAL: ADD FRIEND
══════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">Add a friend</div>
    <input class="field-input" id="newFriendName" type="text" placeholder="Friend's name" />
    <div class="modal-btns">
      <button class="btn-cancel"      onclick="closeAddFriend()">Cancel</button>
      <button class="btn-add-confirm" onclick="confirmAddFriend()">Add Friend</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="app.js?v=3"></script>
</body>
</html>
